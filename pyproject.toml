[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govdata-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for govdata.de (German open data, CKAN) — search datasets, publishers, resources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
govdata-mcp = "govdata_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/govdata_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.govdata.de site"]
